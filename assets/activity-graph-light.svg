    <rect id="cardBg" x="0.5" y="0.5" rx="15" width="1199" height="419" fill="#f0fff0" stroke="#32CD32" stroke-width="1.5" />
    <style>
        .header {
            font: 600 20px 'Segoe UI', Ubuntu, Sans-Serif;
            text-anchor: middle;
            fill: #32CD32;
        }
        .axis-title {
            font: 600 13px 'Segoe UI', Ubuntu, Sans-Serif;
            fill: #333333;
            opacity: 0.8;
        }
        .ct-label {
            font: 500 11px 'Segoe UI', Ubuntu, Sans-Serif;
            fill: #333333;
            opacity: 0.7;
        }
        .ct-grid {
            stroke: #333333;
            stroke-width: 1px;
            stroke-opacity: 0.15;
            stroke-dasharray: 2px 2px;
        }
        .ct-line {
            fill: none;
            stroke: #32CD32;
            stroke-width: 3.5px;
            stroke-linecap: round;
            stroke-linejoin: round;
            stroke-dasharray: 4000;
            stroke-dashoffset: 4000;
            animation: dash 3.5s ease-in-out forwards;
        }
        .ct-area {
            fill: #32CD32;
            fill-opacity: 0.12;
        }
        .ct-point {
            fill: #f0fff0;
            stroke: #32CD32;
            stroke-width: 3px;
            animation: blink 1s ease-in-out forwards;
        }
        @keyframes dash {
            to {
                stroke-dashoffset: 0;
            }
        }
        @keyframes blink {
            from {
                opacity: 0;
                transform: scale(0.5);
                transform-origin: center;
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }
    </style>

